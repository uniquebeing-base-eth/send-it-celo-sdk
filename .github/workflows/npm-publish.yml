name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install
      - run: npm run build
      # Publish to the public npm registry as the unscoped package name
      # `senditwithcelo-sdk` (overrides the scoped name in package.json so
      # the same repo can publish to both npm and GitHub Packages).
      - name: Publish
        run: |
          npm pkg set name=senditwithcelo-sdk
          npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
